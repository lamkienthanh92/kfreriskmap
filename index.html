<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>KFRE Risk Map</title>
<meta name="description" content="Kidney failure risk (4-variable KFRE) set against the KDIGO 2024 heat map: risk map, action thresholds, drivers and repeat-test stability.">
<link rel="icon" type="image/svg+xml" href="assets/img/kidney.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F2F5F9; --surface:#FFFFFF; --s2:#F6F8FB; --ink:#0F2234; --muted:#5A6B7D; --faint:#93A3B4; --line:#E3E9F0;
  --side:#FFFFFF; --side2:#EEF3F8; --side-ink:#4A5B6C; --side-on:#0F2234;
  --primary:#0E9F8E; --primary-soft:#E2F5F2; --primary-ink:#FFFFFF;
  --chart:#2B6CB0; --chart-alt:#9DB8D8;
  --ok:#22A06B; --warn:#EBA13A; --hi:#E8743B; --bad:#D64545;
  --kd-low:#5DB884; --kd-mod:#F2C94C; --kd-high:#F2994A; --kd-vhigh:#E05252;
  --cell-ink:#14212B; --on-bg:rgba(214,69,69,.10); --ok-bg:rgba(34,160,107,.10); --dot:#0F2234; --ring:#FFFFFF;
  --shadow:0 1px 2px rgba(15,34,52,.04),0 8px 24px rgba(15,34,52,.06);
  color-scheme:light;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0A141D; --surface:#101D29; --s2:#142433; --ink:#E5EEF6; --muted:#9DB0C2; --faint:#6B8095; --line:#1F3141;
  --side:#071019; --side2:#0E1C28; --side-ink:#8FA9B8; --side-on:#FFFFFF;
  --primary:#2FD1BD; --primary-soft:#123A38; --primary-ink:#06221F;
  --chart:#7FB2EE; --chart-alt:#3F5F86;
  --ok:#4CC38A; --warn:#F2B65A; --hi:#F2915C; --bad:#F06B6B;
  --kd-low:#3F9A68; --kd-mod:#C9A332; --kd-high:#C97535; --kd-vhigh:#C24646;
  --cell-ink:#FFFFFF; --on-bg:rgba(240,107,107,.14); --ok-bg:rgba(76,195,138,.14); --dot:#F2F6FA; --ring:#0A141D;
  --shadow:none; color-scheme:dark; } }
:root[data-theme="dark"]{
  --bg:#0A141D; --surface:#101D29; --s2:#142433; --ink:#E5EEF6; --muted:#9DB0C2; --faint:#6B8095; --line:#1F3141;
  --side:#071019; --side2:#0E1C28; --side-ink:#8FA9B8; --side-on:#FFFFFF;
  --primary:#2FD1BD; --primary-soft:#123A38; --primary-ink:#06221F;
  --chart:#7FB2EE; --chart-alt:#3F5F86;
  --ok:#4CC38A; --warn:#F2B65A; --hi:#F2915C; --bad:#F06B6B;
  --kd-low:#3F9A68; --kd-mod:#C9A332; --kd-high:#C97535; --kd-vhigh:#C24646;
  --cell-ink:#FFFFFF; --on-bg:rgba(240,107,107,.14); --ok-bg:rgba(76,195,138,.14); --dot:#F2F6FA; --ring:#0A141D;
  --shadow:none; color-scheme:dark; }
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Manrope",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
button{font-family:inherit}
.shell{display:grid;grid-template-columns:236px minmax(0,1fr);min-height:100vh}
.sidebar{border-right:1px solid var(--line);background:var(--side);color:var(--side-ink);position:sticky;top:0;height:100vh;padding:22px 16px;display:flex;flex-direction:column;gap:22px}
.brand{display:flex;align-items:center;gap:11px;padding:0 6px}
.brand .lg{width:42px;height:42px;border-radius:13px;background:var(--primary-soft);display:grid;place-items:center}
.brand .lg img{width:24px}
.brand b{color:var(--side-on);font-size:17px;font-weight:800;letter-spacing:-.01em;display:block;line-height:1.1}
.brand span{font-size:12px}
.menu{display:flex;flex-direction:column;gap:4px}
.menu button{display:flex;align-items:center;gap:12px;width:100%;text-align:left;border:0;background:transparent;color:var(--side-ink);font-size:14.5px;font-weight:600;padding:11px 12px;border-radius:12px;cursor:pointer}
.menu button svg{width:19px;height:19px;flex:none}
.menu button:hover{background:var(--side2);color:var(--side-on)}
.menu button[aria-current=page]{background:var(--primary);color:var(--primary-ink)}
.sidenote{margin-top:auto;font-size:12px;line-height:1.5;background:var(--side2);border-radius:14px;padding:12px}
.sidenote b{color:var(--side-on)}
.main{min-width:0;padding:26px 30px 48px}
.top{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-bottom:20px}
.top h1{font-size:26px;font-weight:800;letter-spacing:-.02em;margin:0;line-height:1.15}
.top .sub{font-size:13.5px;color:var(--muted);margin-top:3px}
.top .actions{margin-left:auto;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.pchips{display:flex;gap:6px;flex-wrap:wrap}
.pchip{font-size:13px;font-weight:700;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:7px 12px;font-variant-numeric:tabular-nums;white-space:nowrap}
.pchip span{color:var(--muted);font-weight:600;margin-right:4px}
.btn{border:0;border-radius:12px;padding:10px 16px;font-size:14px;font-weight:700;cursor:pointer;display:inline-flex;align-items:center;gap:8px}
.btn.primary{background:var(--primary);color:var(--primary-ink)}
.btn.ghost{background:var(--surface);color:var(--ink);border:1px solid var(--line)}
.btn svg{width:17px;height:17px}
.grid{display:grid;gap:18px}
.g12{grid-template-columns:repeat(12,minmax(0,1fr))}
.c4{grid-column:span 4}.c5{grid-column:span 5}.c6{grid-column:span 6}.c7{grid-column:span 7}.c8{grid-column:span 8}.c12{grid-column:span 12}
.card{background:var(--surface);border-radius:20px;padding:20px 22px;box-shadow:var(--shadow);border:1px solid var(--line);min-width:0}
.card h3{margin:0;font-size:15.5px;font-weight:800;letter-spacing:-.01em;display:flex;align-items:center;gap:8px}
.card .cap{font-size:13px;color:var(--muted);margin:4px 0 12px}
.hdr{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.info{border:0;background:var(--s2);color:var(--muted);width:26px;height:26px;border-radius:50%;font-weight:800;cursor:pointer;flex:none}
.explain{font-size:13px;color:var(--muted);background:var(--s2);border-radius:12px;padding:10px 12px;margin-top:10px}
.explain b{color:var(--ink)}
.gauge-card{display:flex;flex-direction:column;align-items:center;text-align:center}
.gauge-card .alt{font-size:12.5px;color:var(--muted);font-variant-numeric:tabular-nums;margin-top:2px}
.status{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:800;border-radius:999px;padding:5px 11px;margin-top:8px}
.status.bad{background:var(--on-bg);color:var(--bad)} .status.ok{background:var(--ok-bg);color:var(--ok)} .status.warn{background:rgba(235,161,58,.14);color:var(--warn)}
.steps{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.step{border-radius:16px;padding:14px;background:var(--s2);position:relative}
.step .n{font-size:11.5px;font-weight:800;color:var(--muted);letter-spacing:.04em;text-transform:uppercase}
.step .t{font-weight:800;font-size:14.5px;margin:4px 0 10px;line-height:1.3}
.step .crit{display:flex;justify-content:space-between;font-size:12.5px;padding:6px 0;border-top:1px solid var(--line)}
.step .crit em{font-style:normal;font-weight:800}
.step .crit em.y{color:var(--bad)} .step .crit em.n{color:var(--faint)}
.step .res{margin-top:10px;font-weight:800;font-size:13px;border-radius:10px;padding:7px 10px;text-align:center}
.step .res.y{background:var(--on-bg);color:var(--bad)} .step .res.n{background:var(--surface);color:var(--muted)}
.callout{margin-top:12px;border-radius:14px;padding:12px 14px;font-size:13.5px;background:var(--on-bg)}
.callout.info{background:var(--primary-soft)}
.toggles{display:flex;gap:6px;flex-wrap:wrap}
.tg{border:1px solid var(--line);background:var(--surface);color:var(--muted);border-radius:999px;padding:6px 12px;font-size:12.5px;font-weight:700;cursor:pointer}
.tg[aria-pressed=true]{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.legend{display:flex;flex-wrap:wrap;gap:12px;font-size:12px;color:var(--muted);margin-top:10px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.sw{width:12px;height:12px;border-radius:3px;display:inline-block}
.ln{width:20px;border-top:2.5px solid var(--chart);display:inline-block}
svg text{font-family:"Manrope",system-ui,sans-serif}
.chart{display:block;max-width:100%;height:auto}
.halo{paint-order:stroke;stroke:var(--surface);stroke-width:4px;stroke-linejoin:round}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.kpi{background:var(--s2);border-radius:14px;padding:12px 14px}
.kpi .k{font-size:12px;color:var(--muted);font-weight:700}
.kpi .v{font-size:24px;font-weight:800;font-variant-numeric:tabular-nums;letter-spacing:-.02em;margin-top:2px}
.donuts{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.donut{display:flex;flex-direction:column;align-items:center;text-align:center;font-size:12.5px;color:var(--muted);font-weight:700}
.findings{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.finding{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:16px;box-shadow:var(--shadow)}
.finding .n{font-size:28px;font-weight:800;letter-spacing:-.02em;color:var(--primary)}
.finding p{margin:6px 0 0;font-size:13px;color:var(--muted)}
.hero{display:grid;grid-template-columns:minmax(0,1fr) 150px;gap:20px;align-items:center;background:linear-gradient(135deg,var(--side),var(--side2));color:var(--side-ink);border-radius:22px;padding:24px 26px}
.hero h2{color:var(--side-on);margin:0 0 8px;font-size:22px;font-weight:800;letter-spacing:-.02em}
.hero p{margin:0;font-size:14px}
.nephron{color:var(--primary);height:180px;display:flex;justify-content:center}
.nephron svg{height:100%;width:auto}
details.acc{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:16px 18px;box-shadow:var(--shadow)}
details.acc summary{cursor:pointer;font-weight:800;font-size:15px;list-style:none}
details.acc summary::-webkit-details-marker{display:none}
details.acc summary::after{content:"+";float:right;color:var(--primary);font-weight:800}
details.acc[open] summary::after{content:"–"}
.methods{font-size:13.5px;color:var(--muted);columns:2;column-gap:28px;margin-top:10px}
.methods p{margin:0 0 9px;break-inside:avoid}
.methods b{color:var(--ink)}
.eq{font-family:ui-monospace,Menlo,monospace;font-size:12px;background:var(--s2);border-radius:10px;padding:8px 10px;display:block;overflow-x:auto;white-space:nowrap;margin:6px 0;color:var(--ink)}
ol.refs{font-size:13px;color:var(--muted);padding-left:18px;margin:10px 0 0}
ol.refs li{margin-bottom:5px}
.credits{font-size:12px;color:var(--muted);margin-top:20px}
/* drawer */
.scrim{position:fixed;inset:0;background:rgba(5,15,25,.45);z-index:40}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(400px,100%);background:var(--surface);z-index:41;box-shadow:-10px 0 40px rgba(0,0,0,.18);display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.drawer .dh{display:flex;align-items:center;justify-content:space-between;padding:18px 20px;border-bottom:1px solid var(--line)}
.drawer .dh b{font-size:17px;font-weight:800}
.drawer .db{padding:16px 20px 24px;overflow-y:auto}
.x{border:0;background:var(--s2);width:34px;height:34px;border-radius:50%;font-size:18px;cursor:pointer;color:var(--ink)}
.field{margin-top:14px}
.field>label,.field>.lab{display:block;font-size:12.5px;font-weight:800;color:var(--muted);margin-bottom:6px;text-transform:uppercase;letter-spacing:.03em}
.row{display:flex;gap:8px}
input[type=number]{width:100%;height:44px;font:inherit;font-weight:700;font-variant-numeric:tabular-nums;color:var(--ink);background:var(--s2);border:1.5px solid transparent;border-radius:12px;padding:0 12px}
input[type=number]:focus{border-color:var(--primary);background:var(--surface);outline:none}
select{height:44px;font:inherit;font-size:14px;font-weight:600;color:var(--ink);background:var(--s2);border:1.5px solid transparent;border-radius:12px;padding:0 8px}
.seg{display:flex;gap:4px;background:var(--s2);border-radius:12px;padding:4px}
.seg button{flex:1;font-size:13.5px;font-weight:700;padding:8px;border:0;border-radius:9px;background:transparent;color:var(--muted);cursor:pointer}
.seg button[aria-pressed=true]{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.1)}
.check{display:flex;align-items:center;gap:8px;font-size:14px;font-weight:600;margin:8px 0;cursor:pointer}
.check input{accent-color:var(--primary);width:17px;height:17px}
.ex{display:grid;gap:8px}
.ex button{text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:10px 12px;cursor:pointer;color:var(--ink)}
.ex button b{display:block;font-size:13.5px}
.ex button span{font-size:12px;color:var(--muted)}
.ex button:hover{border-color:var(--primary)}
.err{color:var(--bad);font-size:13px;margin-top:10px;font-weight:700}
:focus-visible{outline:2.5px solid var(--primary);outline-offset:2px}
.tabbar{display:none}
.mtop{display:none}
@media (max-width: 1100px){ .c4,.c5,.c6,.c7,.c8{grid-column:span 12} .kpis{grid-template-columns:repeat(2,minmax(0,1fr))} }
@media (max-width: 900px){
  .shell{grid-template-columns:minmax(0,1fr)}
  .sidebar{display:none}
  .main{padding:14px 14px calc(96px + env(safe-area-inset-bottom,0px))}
  .mtop{display:flex;align-items:center;gap:10px;position:sticky;top:0;z-index:20;background:var(--bg);margin:-14px -14px 12px;padding:calc(10px + env(safe-area-inset-top,0px)) 14px 10px;border-bottom:1px solid var(--line)}
  .mtop img{width:22px} .mtop .lg{width:36px;height:36px;border-radius:11px;background:var(--primary-soft);display:grid;place-items:center}
  .mtop b{font-weight:800;font-size:16px}
  .mtop .btn{margin-left:auto;padding:8px 12px}
  .top .actions{margin-left:0;width:100%} .top .actions .btn{display:none}
  .top h1{font-size:22px}
  .tabbar{display:flex;position:fixed;left:10px;right:10px;bottom:calc(10px + env(safe-area-inset-bottom,0px));z-index:30;background:var(--surface);border:1px solid var(--line);border-radius:22px;box-shadow:0 10px 30px rgba(0,0,0,.14);padding:6px;justify-content:space-around}
  .tabbar button{border:0;background:transparent;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:2px;font-size:10.5px;font-weight:700;padding:6px 4px;border-radius:14px;flex:1;cursor:pointer}
  .tabbar button svg{width:21px;height:21px}
  .tabbar button[aria-current=page]{color:var(--primary);background:var(--primary-soft)}
  .steps{grid-template-columns:minmax(0,1fr)}
  .findings{grid-template-columns:minmax(0,1fr)}
  .donuts{grid-template-columns:repeat(2,minmax(0,1fr))}
  .hero{grid-template-columns:minmax(0,1fr)} .nephron{height:120px}
  .methods{columns:1}
}
@media (prefers-reduced-motion: reduce){*{transition:none!important}}
.arc{transition:stroke-dasharray .5s ease}

.themes{display:flex;gap:7px;flex-wrap:wrap}
.themes button{width:30px;height:30px;border-radius:50%;border:2px solid var(--line);cursor:pointer;padding:0;position:relative}
.themes button[aria-pressed=true]{border-color:var(--primary);box-shadow:0 0 0 2px var(--surface) inset}
.themes button span{position:absolute;inset:0;border-radius:50%}
.theme-label{font-size:11.5px;font-weight:800;color:var(--side-ink);text-transform:uppercase;letter-spacing:.04em;margin-bottom:8px}
.labs{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.labt{display:flex;align-items:center;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:12px 14px;box-shadow:var(--shadow);min-width:0}
.labt .pl{width:52px;height:52px;flex:none;border-radius:14px;background:#FFFFFF;display:grid;place-items:center;overflow:hidden;box-shadow:0 1px 4px rgba(15,34,52,.08)}
.labt .pl img{max-width:42px;max-height:42px}
.labt .pl .neph{color:var(--primary);height:44px;display:flex}
.labt .pl .neph svg{height:100%;width:auto}
.labt .k{font-size:12px;color:var(--muted);font-weight:700}
.labt .v{font-size:20px;font-weight:800;font-variant-numeric:tabular-nums;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.labt .v small{font-size:12px;color:var(--muted);font-weight:700;margin-left:3px}
.thumb{display:inline-grid;place-items:center;background:#FFFFFF;border-radius:9px;width:30px;height:30px;box-shadow:0 1px 3px rgba(15,34,52,.1);flex:none;overflow:hidden}
.thumb img{max-width:24px;max-height:24px}
@media (max-width: 1100px){ .labs{grid-template-columns:repeat(2,minmax(0,1fr))} }

.banner{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:20px;align-items:center;background:var(--primary-soft);border-radius:20px;padding:18px 22px;border:1px solid var(--line)}
.banner h3{font-size:17px;font-weight:800;margin:0 0 6px;letter-spacing:-.01em}
.banner p{margin:0;font-size:13.5px;color:var(--muted);max-width:70ch}
.banner .facts{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.banner .facts span{font-size:12px;font-weight:700;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:5px 10px}
.plate{background:#FFFFFF;border-radius:18px;padding:10px;display:grid;place-items:center;box-shadow:0 2px 10px rgba(15,34,52,.08)}
.plate img{display:block;height:auto}
.banner .neph{color:var(--primary);height:120px;width:90px}
.banner .neph svg{height:100%;width:auto}
.step .ill{position:absolute;right:12px;top:12px}
.step .ill img{width:18px}
.empty{display:grid;grid-template-columns:auto minmax(0,1fr);gap:20px;align-items:center}
@media (max-width: 900px){ .banner{grid-template-columns:minmax(0,1fr)} .banner .plate,.banner .neph{justify-self:start} }
</style>
