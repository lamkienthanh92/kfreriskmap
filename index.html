<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>KFRE Risk Map</title>
<meta name="description" content="Kidney failure risk (4-variable KFRE) set against the KDIGO 2024 heat map: risk map, action thresholds, drivers and repeat-test stability.">
<link rel="icon" type="image/svg+xml" href="assets/img/kidney.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F2F5F9; --surface:#FFFFFF; --s2:#F6F8FB; --ink:#0F2234; --muted:#5A6B7D; --faint:#93A3B4; --line:#E3E9F0;
  --side:#FFFFFF; --side2:#EEF3F8; --side-ink:#4A5B6C; --side-on:#0F2234;
  --primary:#0E9F8E; --primary-soft:#E2F5F2; --primary-ink:#FFFFFF;
  --chart:#2B6CB0; --chart-alt:#9DB8D8;
  --ok:#22A06B; --warn:#EBA13A; --hi:#E8743B; --bad:#D64545;
  --kd-low:#5DB884; --kd-mod:#F2C94C; --kd-high:#F2994A; --kd-vhigh:#E05252;
  --cell-ink:#14212B; --on-bg:rgba(214,69,69,.10); --ok-bg:rgba(34,160,107,.10); --dot:#0F2234; --ring:#FFFFFF;
  --shadow:0 1px 2px rgba(15,34,52,.04),0 8px 24px rgba(15,34,52,.06);
  color-scheme:light;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0A141D; --surface:#101D29; --s2:#142433; --ink:#E5EEF6; --muted:#9DB0C2; --faint:#6B8095; --line:#1F3141;
  --side:#071019; --side2:#0E1C28; --side-ink:#8FA9B8; --side-on:#FFFFFF;
  --primary:#2FD1BD; --primary-soft:#123A38; --primary-ink:#06221F;
  --chart:#7FB2EE; --chart-alt:#3F5F86;
  --ok:#4CC38A; --warn:#F2B65A; --hi:#F2915C; --bad:#F06B6B;
  --kd-low:#3F9A68; --kd-mod:#C9A332; --kd-high:#C97535; --kd-vhigh:#C24646;
  --cell-ink:#FFFFFF; --on-bg:rgba(240,107,107,.14); --ok-bg:rgba(76,195,138,.14); --dot:#F2F6FA; --ring:#0A141D;
  --shadow:none; color-scheme:dark; } }
:root[data-theme="dark"]{
  --bg:#0A141D; --surface:#101D29; --s2:#142433; --ink:#E5EEF6; --muted:#9DB0C2; --faint:#6B8095; --line:#1F3141;
  --side:#071019; --side2:#0E1C28; --side-ink:#8FA9B8; --side-on:#FFFFFF;
  --primary:#2FD1BD; --primary-soft:#123A38; --primary-ink:#06221F;
  --chart:#7FB2EE; --chart-alt:#3F5F86;
  --ok:#4CC38A; --warn:#F2B65A; --hi:#F2915C; --bad:#F06B6B;
  --kd-low:#3F9A68; --kd-mod:#C9A332; --kd-high:#C97535; --kd-vhigh:#C24646;
  --cell-ink:#FFFFFF; --on-bg:rgba(240,107,107,.14); --ok-bg:rgba(76,195,138,.14); --dot:#F2F6FA; --ring:#0A141D;
  --shadow:none; color-scheme:dark; }
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Manrope",system-ui,-apple-system,"Segoe UI",Roboto,Arial,"Hiragino Sans","Yu Gothic","Noto Sans JP","PingFang SC","Microsoft YaHei","Noto Sans SC",sans-serif;font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
button{font-family:inherit}
.shell{display:grid;grid-template-columns:236px minmax(0,1fr);min-height:100vh}
.sidebar{border-right:1px solid var(--line);background:var(--side);color:var(--side-ink);position:sticky;top:0;height:100vh;padding:22px 16px;display:flex;flex-direction:column;gap:22px}
.brand{display:flex;align-items:center;gap:11px;padding:0 6px}
.brand .lg{width:42px;height:42px;border-radius:13px;background:var(--primary-soft);display:grid;place-items:center}
.brand .lg img{width:24px}
.brand b{color:var(--side-on);font-size:17px;font-weight:800;letter-spacing:-.01em;display:block;line-height:1.1}
.brand span{font-size:12px}
.menu{display:flex;flex-direction:column;gap:4px}
.menu button{display:flex;align-items:center;gap:12px;width:100%;text-align:left;border:0;background:transparent;color:var(--side-ink);font-size:14.5px;font-weight:600;padding:11px 12px;border-radius:12px;cursor:pointer}
.menu button svg{width:19px;height:19px;flex:none}
.menu button:hover{background:var(--side2);color:var(--side-on)}
.menu button[aria-current=page]{background:var(--primary);color:var(--primary-ink)}
.sidenote{margin-top:auto;font-size:12px;line-height:1.5;background:var(--side2);border-radius:14px;padding:12px}
.sidenote b{color:var(--side-on)}
.main{min-width:0;padding:26px 30px 48px}
.top{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-bottom:20px}
.top h1{font-size:26px;font-weight:800;letter-spacing:-.02em;margin:0;line-height:1.15}
.top .sub{font-size:13.5px;color:var(--muted);margin-top:3px}
.top .actions{margin-left:auto;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.pchips{display:flex;gap:6px;flex-wrap:wrap}
.pchip{font-size:13px;font-weight:700;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:7px 12px;font-variant-numeric:tabular-nums;white-space:nowrap}
.pchip span{color:var(--muted);font-weight:600;margin-right:4px}
.btn{border:0;border-radius:12px;padding:10px 16px;font-size:14px;font-weight:700;cursor:pointer;display:inline-flex;align-items:center;gap:8px}
.btn.primary{background:var(--primary);color:var(--primary-ink)}
.btn.ghost{background:var(--surface);color:var(--ink);border:1px solid var(--line)}
.btn svg{width:17px;height:17px}
.grid{display:grid;gap:18px}
.g12{grid-template-columns:repeat(12,minmax(0,1fr))}
.c4{grid-column:span 4}.c5{grid-column:span 5}.c6{grid-column:span 6}.c7{grid-column:span 7}.c8{grid-column:span 8}.c12{grid-column:span 12}
.card{background:var(--surface);border-radius:20px;padding:20px 22px;box-shadow:var(--shadow);border:1px solid var(--line);min-width:0}
.card h3{margin:0;font-size:15.5px;font-weight:800;letter-spacing:-.01em;display:flex;align-items:center;gap:8px}
.card .cap{font-size:13px;color:var(--muted);margin:4px 0 12px}
.hdr{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.info{border:0;background:var(--s2);color:var(--muted);width:26px;height:26px;border-radius:50%;font-weight:800;cursor:pointer;flex:none}
.explain{font-size:13px;color:var(--muted);background:var(--s2);border-radius:12px;padding:10px 12px;margin-top:10px}
.explain b{color:var(--ink)}
.gauge-card{display:flex;flex-direction:column;align-items:center;text-align:center}
.gauge-card .alt{font-size:12.5px;color:var(--muted);font-variant-numeric:tabular-nums;margin-top:2px}
.status{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:800;border-radius:999px;padding:5px 11px;margin-top:8px}
.status.bad{background:var(--on-bg);color:var(--bad)} .status.ok{background:var(--ok-bg);color:var(--ok)} .status.warn{background:rgba(235,161,58,.14);color:var(--warn)}
.steps{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.step{border-radius:16px;padding:14px;background:var(--s2);position:relative}
.step .n{font-size:11.5px;font-weight:800;color:var(--muted);letter-spacing:.04em;text-transform:uppercase}
.step .t{font-weight:800;font-size:14.5px;margin:4px 0 10px;line-height:1.3}
.step .crit{display:flex;justify-content:space-between;font-size:12.5px;padding:6px 0;border-top:1px solid var(--line)}
.step .crit em{font-style:normal;font-weight:800}
.step .crit em.y{color:var(--bad)} .step .crit em.n{color:var(--faint)}
.step .res{margin-top:10px;font-weight:800;font-size:13px;border-radius:10px;padding:7px 10px;text-align:center}
.step .res.y{background:var(--on-bg);color:var(--bad)} .step .res.n{background:var(--surface);color:var(--muted)}
.callout{margin-top:12px;border-radius:14px;padding:12px 14px;font-size:13.5px;background:var(--on-bg)}
.callout.info{background:var(--primary-soft)}
.toggles{display:flex;gap:6px;flex-wrap:wrap}
.tg{border:1px solid var(--line);background:var(--surface);color:var(--muted);border-radius:999px;padding:6px 12px;font-size:12.5px;font-weight:700;cursor:pointer}
.tg[aria-pressed=true]{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.legend{display:flex;flex-wrap:wrap;gap:12px;font-size:12px;color:var(--muted);margin-top:10px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.sw{width:12px;height:12px;border-radius:3px;display:inline-block}
.ln{width:20px;border-top:2.5px solid var(--chart);display:inline-block}
svg text{font-family:"Manrope",system-ui,"Hiragino Sans","Yu Gothic","PingFang SC","Microsoft YaHei",sans-serif}
.langpick{margin-bottom:14px}.langsel{width:100%;height:36px;font:inherit;font-size:14px;padding:0 8px;border-radius:10px;background:var(--s2);color:var(--ink);border:1px solid var(--line)}
.chart{display:block;max-width:100%;height:auto}
.halo{paint-order:stroke;stroke:var(--surface);stroke-width:4px;stroke-linejoin:round}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.kpi{background:var(--s2);border-radius:14px;padding:12px 14px}
.kpi .k{font-size:12px;color:var(--muted);font-weight:700}
.kpi .v{font-size:24px;font-weight:800;font-variant-numeric:tabular-nums;letter-spacing:-.02em;margin-top:2px}
.donuts{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.donut{display:flex;flex-direction:column;align-items:center;text-align:center;font-size:12.5px;color:var(--muted);font-weight:700}
.findings{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.finding{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:16px;box-shadow:var(--shadow)}
.finding .n{font-size:28px;font-weight:800;letter-spacing:-.02em;color:var(--primary)}
.finding p{margin:6px 0 0;font-size:13px;color:var(--muted)}
.hero{display:grid;grid-template-columns:minmax(0,1fr) 150px;gap:20px;align-items:center;background:linear-gradient(135deg,var(--side),var(--side2));color:var(--side-ink);border-radius:22px;padding:24px 26px}
.hero h2{color:var(--side-on);margin:0 0 8px;font-size:22px;font-weight:800;letter-spacing:-.02em}
.hero p{margin:0;font-size:14px}
.nephron{color:var(--primary);height:180px;display:flex;justify-content:center}
.nephron svg{height:100%;width:auto}
details.acc{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:16px 18px;box-shadow:var(--shadow)}
details.acc summary{cursor:pointer;font-weight:800;font-size:15px;list-style:none}
details.acc summary::-webkit-details-marker{display:none}
details.acc summary::after{content:"+";float:right;color:var(--primary);font-weight:800}
details.acc[open] summary::after{content:"–"}
.methods{font-size:13.5px;color:var(--muted);columns:2;column-gap:28px;margin-top:10px}
.methods p{margin:0 0 9px;break-inside:avoid}
.methods b{color:var(--ink)}
.eq{font-family:ui-monospace,Menlo,monospace;font-size:12px;background:var(--s2);border-radius:10px;padding:8px 10px;display:block;overflow-x:auto;white-space:nowrap;margin:6px 0;color:var(--ink)}
ol.refs{font-size:13px;color:var(--muted);padding-left:18px;margin:10px 0 0}
ol.refs li{margin-bottom:5px}
.credits{font-size:12px;color:var(--muted);margin-top:20px}
/* drawer */
.scrim{position:fixed;inset:0;background:rgba(5,15,25,.45);z-index:40}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(400px,100%);background:var(--surface);z-index:41;box-shadow:-10px 0 40px rgba(0,0,0,.18);display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.drawer .dh{display:flex;align-items:center;justify-content:space-between;padding:18px 20px;border-bottom:1px solid var(--line)}
.drawer .dh b{font-size:17px;font-weight:800}
.drawer .db{padding:16px 20px 24px;overflow-y:auto}
.x{border:0;background:var(--s2);width:34px;height:34px;border-radius:50%;font-size:18px;cursor:pointer;color:var(--ink)}
.field{margin-top:14px}
.field>label,.field>.lab{display:block;font-size:12.5px;font-weight:800;color:var(--muted);margin-bottom:6px;text-transform:uppercase;letter-spacing:.03em}
.row{display:flex;gap:8px}
input[type=number]{width:100%;height:44px;font:inherit;font-weight:700;font-variant-numeric:tabular-nums;color:var(--ink);background:var(--s2);border:1.5px solid transparent;border-radius:12px;padding:0 12px}
input[type=number]:focus{border-color:var(--primary);background:var(--surface);outline:none}
select{height:44px;font:inherit;font-size:14px;font-weight:600;color:var(--ink);background:var(--s2);border:1.5px solid transparent;border-radius:12px;padding:0 8px}
.seg{display:flex;gap:4px;background:var(--s2);border-radius:12px;padding:4px}
.seg button{flex:1;font-size:13.5px;font-weight:700;padding:8px;border:0;border-radius:9px;background:transparent;color:var(--muted);cursor:pointer}
.seg button[aria-pressed=true]{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.1)}
.check{display:flex;align-items:center;gap:8px;font-size:14px;font-weight:600;margin:8px 0;cursor:pointer}
.check input{accent-color:var(--primary);width:17px;height:17px}
.ex{display:grid;gap:8px}
.ex button{text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:10px 12px;cursor:pointer;color:var(--ink)}
.ex button b{display:block;font-size:13.5px}
.ex button span{font-size:12px;color:var(--muted)}
.ex button:hover{border-color:var(--primary)}
.err{color:var(--bad);font-size:13px;margin-top:10px;font-weight:700}
:focus-visible{outline:2.5px solid var(--primary);outline-offset:2px}
.tabbar{display:none}
.mtop{display:none}
@media (max-width: 1100px){ .c4,.c5,.c6,.c7,.c8{grid-column:span 12} .kpis{grid-template-columns:repeat(2,minmax(0,1fr))} }
@media (max-width: 900px){
  .shell{grid-template-columns:minmax(0,1fr)}
  .sidebar{display:none}
  .main{padding:14px 14px calc(96px + env(safe-area-inset-bottom,0px))}
  .mtop{display:flex;align-items:center;gap:10px;position:sticky;top:0;z-index:20;background:var(--bg);margin:-14px -14px 12px;padding:calc(10px + env(safe-area-inset-top,0px)) 14px 10px;border-bottom:1px solid var(--line)}
  .mtop img{width:22px} .mtop .lg{width:36px;height:36px;border-radius:11px;background:var(--primary-soft);display:grid;place-items:center}
  .mtop b{font-weight:800;font-size:16px}
  .mtop .btn{margin-left:auto;padding:8px 12px}
  .top .actions{margin-left:0;width:100%} .top .actions .btn{display:none}
  .top h1{font-size:22px}
  .tabbar{display:flex;position:fixed;left:10px;right:10px;bottom:calc(10px + env(safe-area-inset-bottom,0px));z-index:30;background:var(--surface);border:1px solid var(--line);border-radius:22px;box-shadow:0 10px 30px rgba(0,0,0,.14);padding:6px;justify-content:space-around}
  .tabbar button{border:0;background:transparent;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:2px;font-size:10.5px;font-weight:700;padding:6px 4px;border-radius:14px;flex:1;cursor:pointer}
  .tabbar button svg{width:21px;height:21px}
  .tabbar button[aria-current=page]{color:var(--primary);background:var(--primary-soft)}
  .steps{grid-template-columns:minmax(0,1fr)}
  .findings{grid-template-columns:minmax(0,1fr)}
  .donuts{grid-template-columns:repeat(2,minmax(0,1fr))}
  .hero{grid-template-columns:minmax(0,1fr)} .nephron{height:120px}
  .methods{columns:1}
}
@media (prefers-reduced-motion: reduce){*{transition:none!important}}
.arc{transition:stroke-dasharray .5s ease}

.themes{display:flex;gap:7px;flex-wrap:wrap}
.themes button{width:30px;height:30px;border-radius:50%;border:2px solid var(--line);cursor:pointer;padding:0;position:relative}
.themes button[aria-pressed=true]{border-color:var(--primary);box-shadow:0 0 0 2px var(--surface) inset}
.themes button span{position:absolute;inset:0;border-radius:50%}
.theme-label{font-size:11.5px;font-weight:800;color:var(--side-ink);text-transform:uppercase;letter-spacing:.04em;margin-bottom:8px}
.labs{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.labt{display:flex;align-items:center;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:12px 14px;box-shadow:var(--shadow);min-width:0}
.labt .pl{width:52px;height:52px;flex:none;border-radius:14px;background:#FFFFFF;display:grid;place-items:center;overflow:hidden;box-shadow:0 1px 4px rgba(15,34,52,.08)}
.labt .pl img{max-width:42px;max-height:42px}
.labt .pl .neph{color:var(--primary);height:44px;display:flex}
.labt .pl .neph svg{height:100%;width:auto}
.labt .k{font-size:12px;color:var(--muted);font-weight:700}
.labt .v{font-size:20px;font-weight:800;font-variant-numeric:tabular-nums;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.labt .v small{font-size:12px;color:var(--muted);font-weight:700;margin-left:3px}
.thumb{display:inline-grid;place-items:center;background:#FFFFFF;border-radius:9px;width:30px;height:30px;box-shadow:0 1px 3px rgba(15,34,52,.1);flex:none;overflow:hidden}
.thumb img{max-width:24px;max-height:24px}
@media (max-width: 1100px){ .labs{grid-template-columns:repeat(2,minmax(0,1fr))} }

.banner{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:20px;align-items:center;background:var(--primary-soft);border-radius:20px;padding:18px 22px;border:1px solid var(--line)}
.banner h3{font-size:17px;font-weight:800;margin:0 0 6px;letter-spacing:-.01em}
.banner p{margin:0;font-size:13.5px;color:var(--muted);max-width:70ch}
.banner .facts{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.banner .facts span{font-size:12px;font-weight:700;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:5px 10px}
.plate{background:#FFFFFF;border-radius:18px;padding:10px;display:grid;place-items:center;box-shadow:0 2px 10px rgba(15,34,52,.08)}
.plate img{display:block;height:auto}
.banner .neph{color:var(--primary);height:120px;width:90px}
.banner .neph svg{height:100%;width:auto}
.step .ill{position:absolute;right:12px;top:12px}
.step .ill img{width:18px}
.empty{display:grid;grid-template-columns:auto minmax(0,1fr);gap:20px;align-items:center}
@media (max-width: 900px){ .banner{grid-template-columns:minmax(0,1fr)} .banner .plate,.banner .neph{justify-self:start} }
</style>

hot": "Một mẫu chỉ là một khoảnh khắc", "Urine ACR varies from day to day, and creatinine varies less but still moves. Near a threshold, a single result can fall on either side. This screen simulates repeat samples to show how often the decision would change.": "ACR niệu dao động theo ngày; creatinin dao động ít hơn nhưng vẫn thay đổi. Gần ngưỡng, một kết quả đơn lẻ có thể rơi về bất kỳ phía nào. Màn hình này mô phỏng các mẫu lặp lại để cho thấy quyết định thay đổi thường xuyên ra sao.", "Published variability (ACR 11.3%)": "Độ dao động đã công bố (ACR 11,3%)", "Conservative (ACR 30%)": "Thận trọng (ACR 30%)", "Creatinine CV 5.5%": "CV creatinin 5,5%", "ACR day-to-day CV 11.3%": "CV ACR theo ngày 11,3%", "3,000 simulated repeats": "3.000 lần lặp mô phỏng", "Chance of being above each threshold on a repeat test": "Khả năng vượt từng ngưỡng ở lần xét nghiệm lặp lại", "3,000 simulated repeat measurements of creatinine and ACR": "3.000 lần đo lặp lại mô phỏng creatinin và ACR", "A probability between 20% and 80% means a single repeat test could change the decision. Repeat ACR and creatinine before acting on a borderline result.": "Xác suất từ 20% đến 80% nghĩa là một lần xét nghiệm lặp lại có thể làm thay đổi quyết định. Hãy làm lại ACR và creatinin trước khi xử trí theo một kết quả sát ngưỡng.", "stays above": "luôn trên ngưỡng", "stays below": "luôn dưới ngưỡng", "2-year risk on repeat testing": "Nguy cơ 2 năm qua các lần xét nghiệm lặp lại", "5-year risk on repeat testing": "Nguy cơ 5 năm qua các lần xét nghiệm lặp lại", "Distribution": "Phân bố", "How to read this chart": "Cách đọc biểu đồ này", "Dialyser": "Quả lọc", "Urine sample with a reagent test strip": "Mẫu nước tiểu với que thử", "The study": "Nghiên cứu", "Findings from 129 patients at Lanh Binh Thang General Hospital": "Kết quả từ 129 bệnh nhân tại Bệnh viện Đa khoa Lãnh Binh Thăng", "KFRE versus the KDIGO 2024 heat map": "KFRE so với bản đồ nhiệt KDIGO 2024", "Cross-sectional study of 129 outpatients with  (4 biến).", "Risk = 1 − S^exp(LP); S = 0.9832 (2-year) and 0.9365 (5-year) outside North America; 0.9750 and 0.9240 in North America.": "Nguy cơ = 1 − S^exp(LP); S = 0,9832 (2 năm) và 0,9365 (5 năm) ngoài Bắc Mỹ; 0,9750 và 0,9240 ở Bắc Mỹ.", "Thresholds.": "Ngưỡng.", "KDIGO 2024: 5-year 3–5% for referral, 2-year >10% for multidisciplinary care, 2-year >40% for KRT preparation; eGFR criteria <30, <30 and <20. NICE NG203: 5-year >5%.": "KDIGO 2024: 5 năm 3–5% để chuyển khám, 2 năm >10% để chăm sóc đa chuyên khoa, 2 năm >40% để chuẩn bị điều trị thay thế thận; tiêu chí eGFR <30, <30 và <20. NICE NG203: 5 năm >5%.", "Contours, what-if curves and waterfall.": "Đường đồng mức, đường giả định và biểu đồ thác nước.", "Solved directly from the equation, holding the other variables constant.": "Giải trực tiếp từ phương trình, giữ nguyên các biến khác.", "Repeat testing.": "Xét nghiệm lặp lại.", "3,000 draws from mean-preserving log-normal distributions with published day-to-day variability (creatinine 5.5%, ACR 11.3%; McCudden 2018) or a conservative alternative (5% and 30%).": "3.000 lần rút từ phân bố log-chuẩn giữ nguyên trung bình, với độ dao động theo ngày đã công bố (creatinin 5,5%, ACR 11,3%; McCudden 2018) hoặc phương án thận trọng (5% và 30%).", "PCR conversion.": "Quy đổi PCR.", "Sumida 2020, adjusted for sex, diabetes and hypertension.": "Sumida 2020, có hiệu chỉnh theo giới, đái tháo đường và tăng huyết áp.", "Clinic data.": "Dữ liệu phòng khám.", "eGFR, ACR, KDIGO grade and KFRE risk of 129 de-identified patients.": "eGFR, ACR, phân độ KDIGO và nguy cơ KFRE của 129 bệnh nhân đã khử định danh.", "Limitations.": "Hạn chế.", "No outcome data to check calibration in Vietnamese patients; death not modelled as a competing event; single measurements.": "Chưa có dữ liệu kết cục để kiểm tra hiệu chỉnh ở bệnh nhân Việt Nam; chưa mô hình hóa tử vong như biến cố cạnh tranh; mỗi chỉ số chỉ đo một lần.", "How to read it.": "Cách đọc.", "Illustrations: kidney by Servier Medica  reference patient is 70 years old, 56% male, with eGFR 36.1 and ACR 170 mg/g (2-year risk 1.68%). Each bar multiplies the hazard by the factor shown; red raises risk, teal lowers it. In the study cohort, eGFR explained 70% of between-patient variation, ACR 27%, age 3% and sex 1%.": "KFREの基準患者は70歳、男性56%、eGFR 36.1、ACR 170 mg/g（2年リスク1.68%）です。各棒は表示された係数でハザードを乗じ、赤はリスクを上げ、青緑は下げます。研究対象集団では、患者間のばらつきのうちeGFRが70%、ACRが27%、年齢が3%、性別が1%を説明しました。", "If eGFR falls": "eGFRが低下したら", "Age, sex and ACR held constant": "年齢・性別・ACRは一定", "Grey lines mark the eGFR criteria. Where the curve crosses a red threshold to the right of its grey line, the KFRE criterion would be met later than the eGFR criterion. The dashed curve uses North American calibration.": "灰色の線はeGFR基準です。曲線が灰色の線より右で赤い閾値と交わる場合、KFRE基準はeGFR基準より遅れて満たされます。破線の曲線は北米較正です。", "If albuminuria changes": "アルブミン尿が変化したら", "Age, sex and eGFR held constant": "年齢・性別・eGFRは一定", "Grey lines mark the KDIGO albuminuria boundaries (30 and 300 mg/g). A tenfold change in ACR changes the hazard 2.8-fold.": "灰色の線はKDIGOのアルブミン尿区分の境界（30と300 mg/g）です。ACRが10倍変わるとハザードは2.8倍変わります。", "If the patient were older or younger": "患者がより高齢または若年なら", "Sex, eGFR and ACR held constant": "性別・eGFR・ACRは一定", "Older age lowers predicted risk because, on average, older patients progress more slowly and more often die before kidney failure. This is why the 40% threshold is reached late in older adults.": "高齢になるほど予測リスクは下がります。平均すると高齢患者は進行が遅く、腎不全に至る前に亡くなることが多いためです。そのため高齢者では40%閾値への到達が遅れます。", "40% never reached": "40%に到達しない", "woman": "女性", "man": "男性", "How stable the classification is": "分類はどれほど安定しているか", "One sample is a snapshot": "1回の検体はスナップショット", "Urine ACR varies from day to day, and creatinine varies less but still moves. Near a threshold, a single result can fall on either side. This screen simulates repeat samples to show how often the decision would change.": "尿ACRは日によって変動し、クレアチニンは変動が小さいものの変化します。閾値付近では1回の結果がどちら側にも入り得ます。この画面は再検体をシミュレーションし、判断がどのくらい変わるかを示します。", "Published variability (ACR 11.3%)": "既報の変動（ACR 11.3%）", "Conservative (ACR 30%)": "保守的（ACR 30%）", "Creatinine CV 5.5%": "クレアチニンCV 5.5%", "ACR day-to-day CV 11.3%": "ACRの日間CV 11.3%", "3,000 simulated repeats": "3,000回のシミュレーション", "Chance of being above each threshold on a repeat test": "再検査で各閾値を超える確率", "3,000 simulated repeat measurements of creatinine and ACR": "クレアチニンとACRの3,000回の再測定シミュレーション", "A probability between 20% and 80% means a single repeat test could change the decision. Repeat ACR and creatinine before acting on a borderline result.": "確率が20%～80%なら、再検査1回で判断が変わり得ます。境界域の結果で対応する前に、ACRとクレアチニンを再検してください。", "stays above": "閾値以上を維持", "stays below": "閾値未満を維持", "2-year risk on repeat testing": "再検査での2年リスク", "5-year risk on repeat testing": "再検査での5年リスク", "Distribution": "分布", "How to read this chart": "この図の読み方", "Dialyser": "ダイアライザー", "Urine sample with a reagent test strip": "尿検体と試験紙", "The study": "研究について", "Findings from 129 patients at Lanh Binh Thang General Hospital": "Lanh Binh Thang General Hospitalの患者129人の結果", "KFRE versus the KDIGO 2024 heat map": "KFREとKDIGO 2024ヒートマップの比較", "Cross-sectional study of 129 outpatients with CKD G3–G5 at Lanh Binh Thang General Hospital, Ho Chi Minh City (May–September 2026). The study compared KFRE-based and heat-map risk stratification and decomposed the KFRE mathematically to explain where, and why, the two disagree.": "ホーチミン市Lanh Binh Thang General HospitalのCKD G3–G5外来患者129人を対象とした横断研究（2026年5～9月）。KFREとヒートマップによるリスク層別化を比較し、KFREを数学的に分解して両者がどこで、なぜ食い違うかを説明しました。", "patients with a 5-year risk of 3% or more were already very high risk by KDIGO.": "5年リスク3%以上の患者は、すでにKDIGOで超高リスクでした。", "very-high-risk patients had a 5-year risk below 3%, eight of them in cell G3a–A3.": "超高リスクの患者で5年リスクが3%未満、うち8人はセルG3a–A3。", "weight of one GFR step relative to one albuminuria step; eGFR explained 70% of variation.": "アルブミン尿1段階に対するGFR 1段階の重み。eGFRがばらつきの70%を説明。", "patients above 40% with North American instead of non-North American constants.": "北米以外ではなく北米の定数を用いると40%を超える患者。 于3%。热图还反映死亡和心血管风险，仍需随访白蛋白尿。", "Late trigger in an older woman.": "老年女性触发较晚。", "At the current ACR, the 2-year risk never reaches 40%.": "在当前ACR下，2年风险始终达不到40%。", "Use an eGFR criterion below 20 alongside the 40% threshold.": "在40%阈值之外同时使用eGFR<20的标准。", "Clinic comparison": "与门诊患者比较", "Same age, eGFR and ACR": "相同年龄、eGFR和ACR", "Female versus male": "女性与男性", "Female (this patient)": "女性（本患者）", "Male sex multiplies the hazard by 1.28, equivalent to an eGFR about 2.2 mL/min/1.73 m² lower.": "男性使风险乘以1.28，相当于eGFR低约2.2 mL/min/1.73 m²。", "North American": "北美", "Non-North American": "非北美", "North American calibration": "北美校准", "No KFRE estimate": "无KFRE估计", "Five-year risk of clinic patients by KDIGO category with this patient marked": "按KDIGO分级的门诊患者5年风险（标出本患者）", "● patient": "● 患者", "patient": "患者", "ref": "参照", "Reference": "参照", "Where the patient sits on the eGFR–ACR plane": "患者在eGFR–ACR平面上的位置", "eGFR–ACR risk map": "eGFR–ACR风险图", "Risk map of eGFR against ACR with KDIGO cells and KFRE contours": "带KDIGO单元格和KFRE等高线的eGFR-ACR风险图", "Risk rises towards the lower right. A patient above a contour is below that threshold. The dashed drop line shows how far eGFR must fall, at the current ACR, before the 2-year risk reaches 40%. Contours slope because the KFRE weighs one GFR step (×5.3) about 1.6 times more than one albuminuria step (×2.8), whereas the heat map treats the two axes equally.": "风险向右下方升高。位于某条等高线上方的患者低于该阈值。虚线垂线显示在当前ACR下eGFR需下降多少，2年风险才达到40%。等高线倾斜是因为KFRE对一个GFR分级（×5.3）的权重约为一个白蛋白尿分级（×2.8）的1.6倍，而热图对两条轴同等对待。", "Solid 5-yr 3% · dashed 2-yr 10% · dotted 2-yr 40%": "实线 5年3% · 虚线 2年10% · 点线 2年40%", "5-yr": "5年", "2-yr": "2年", "Urine ACR (mg/g, log scale)": "尿ACR（mg/g，对数刻度）", "eGFR (mL/min/1.73 m²)": "eGFR（mL/min/1.73 m²）", "ACR (mg/g, log scale)": "ACR（mg/g，对数刻度）", "eGFR (CKD-EPI 2021)": "eGFR（CKD-EPI 2021）", "Urine ACR": "尿ACR", "eGFR ≥60 ↑": "eGFR ≥60 ↑", "Clinic patients": "门诊患者", "5-year risk bands by KDIGO category": "按KDIGO分级的5年风险区间", "Number of clinic patients in each band": "各区间的门诊患者数", "Share of clinic patients in each 5-year risk band by KDIGO category": "按KDIGO分级各5年风险区间的门诊患者比例", "5-year <3%": "5年 <3%", "5-year 3–5%": "5年 3–5%", "5-year >5%": "5年 >5%", "5-year ≥3%": "5年 ≥3%", "2-year >10%": "2年 >10%", "2-year >40%": "2年 >40%", "Calibration changes the 40% decision": "校准改变40%阈值的决策", "Clinic patients above each threshold under two calibrations": "两种校准下超过各阈值的门诊患者", "Number of clinic patients above each threshold under two calibrations": "两种校准下超过各阈值的门诊患者数", "Clinic data not included": "未包含门诊数据", "This build does not include the de-identified clinic dataset (assets/js/cohort.js), so charts based on the study cohort are hidden. The calculator itself is unaffected.": "此版本不包含去标识化的门诊数据（assets/js/cohort.js），因此基于研究队列的图表被隐藏。计算功能不受影响。", "What drives the estimate and how it changes": "影响估计的因素及其变化", "Four inputs, one equation": "四个输入，一个方程", "The KFRE combines age, sex, eGFR and urine ACR into a single linear predictor. eGFR dominates: one KDIGO GFR step multiplies the hazard by 5.3, one albuminuria step by 2.8, male sex by 1.28, and each extra decade of age lowers it by 20%.": "KFRE将年龄、性别、eGFR和尿ACR合并为一个线性预测值。eGFR影响最大：KDIGO的一个GFR分级使风险乘以5.3，一个白蛋白尿分级乘以2.8，男性乘以1.28，年龄每增加10岁降低20%。", "GFR step ×5.31": "GFR分级 ×5.31", "Albuminuria step ×2.82": "白蛋白尿分级 ×2.82", "Male ×1.28": "男性 ×1.28", "+10 years ×0.80": "+10岁 ×0.80", "From the reference patient to this patient": "从参照患者到本患者", "2-year risk as each variable is applied in turn": "依次代入各变量时的2年风险", "Waterfall of the KFRE linear predictor from the reference patient to this patient": "从参照患者到本患者的KFRE线性预测值瀑布图", "The KFRE reference patient is 70 years old, 56% male, with eGFR 36.1 and ACR 170 mg/g (2-year risk 1.68%). Each bar multiplies the hazard by the factor shown; red raises risk, teal lowers it. In the study cohort, eGFR explained 70% of between-patient variation, ACR 27%, age 3% and sex 1%.": "KFRE参照患者为70岁、男性占56%、eGFR 36.1、ACR 170 mg/g（2年风险1.68%）。每根柱按所示系数改变风险；红色升高风险，青色降低风险。在研究队列中，eGFR解释了患者间差异的70%，ACR 27%，年龄3%，性别1%。", "If eGFR falls": "如果eGFR下降", "Age, sex and ACR held constant": "年龄、性别和ACR保持不变", "Grey lines mark the eGFR criteria. Where the curve crosses a red threshold to the right of its grey line, the KFRE criterion would be met later than the eGFR criterion. The dashed curve uses North American calibration.": "灰线表示eGFR标准。若曲线在其灰线右侧与红色阈值相交，则KFRE标准晚于eGFR标准满足。虚线曲线采用北美校准。", "If albuminuria changes": "如果白蛋白尿变化", "Age, sex and eGFR held constant": "年龄、性别和eGFR保持不变", "Grey lines mark the KDIGO albuminuria boundaries (30 and 300 mg/g). A tenfold change in ACR changes the hazard 2.8-fold.": "灰线为KDIGO白蛋白尿分界（30和300 mg/g）。ACR变化10倍，风险变化2.8倍。", "If the patient were older or younger": "如果患者更年长或更年轻", "Sex, eGFR and ACR held constant": "性别、eGFR和ACR保持不变", "Older age lowers predicted risk because, on average, older patients progress more slowly and more often die before kidney failure. This is why the 40% threshold is reached late in older adults.": "年龄越大预测风险越低，因为老年患者平均进展较慢，且更常在肾衰竭前死亡。因此老年人到达40%阈值较晚。", "40% never reached": "始终达不到40%", "woman": "女性", "man": "男性", "How stable the classification is": "分类有多稳定", "One sample is a snapshot": "一次样本只是一个瞬间", "Urine ACR varies from day to day, and creatinine varies less but still moves. Near a threshold, a single result can fall on either side. This screen simulates repeat samples to show how often the decision would change.": "尿ACR每天都有波动，肌酐波动较小但仍会变化。接近阈值时，单次结果可能落在任一侧。本页面模拟重复采样，显示决策改变的频率。", "Published variability (ACR 11.3%)": "已发表的变异（ACR 11.3%）", "Conservative (ACR 30%)": "保守估计（ACR 30%）", "Creatinine CV 5.5%": "肌酐CV 5.5%", "ACR day-to-day CV 11.3%": "ACR日间CV 11.3%", "3,000 simulated repeats": "3,000次模拟重复", "Chance of being above each threshold on a repeat test": "重复检测时超过各阈值的概率", "3,000 simulated repeat measurements of creatinine and ACR": "3,000次肌酐和ACR重复测量模拟", "A probability between 20% and 80% means a single repeat test could change the decision. Repeat ACR and creatinine before acting on a borderline result.": "概率在20%至80%之间意味着一次重复检测可能改变决策。对于临界结果，请先复查ACR和肌酐再处理。", "stays above": "保持在阈值以上", "stays below": "保持在阈值以下", "2-year risk on repeat testing": "重复检测时的2年风险", "5-year risk on repeat testing": "重复检测时的5年风险", "Distribution": "分布", "How to read this chart": "如何解读此图", "Dialyser": "透析器", "Urine sample with a reagent test strip": "尿样与试纸", "The study": "研究简介", "Findings from 129 patients at Lanh Binh Thang General Hospital": "来自Lanh Binh Thang General Hospital 129名患者的结果", "KFRE versus the KDIGO 2024 heat map": "KFRE与KDIGO 2024热图对比", "Cross-sectional study of 129 outpatients with CKD G3–G5 at Lanh Binh Thang General Hospital, Ho Chi Minh City (May–September 2026). The study compared KFRE-based and heat-map risk stratification and decomposed the KFRE mathematically to explain where, and why, the two disagree.": "在胡志明市Lanh Binh Thang General Hospital对129名CKD G3–G5门诊患者开展的横断面研究（2026年5–9月）。研究比较了基于KFRE和基于热图的风险分层，并对KFRE进行数学分解，以解释两者在何处、为何不一致。", "patients with a 5-year risk of 3% or more were already very high risk by KDIGO.": "5年风险≥3%的患者在KDIGO中已属极高风险。", "very-high-risk patients had a 5-year risk below 3%, eight of them in cell G3a–A3.": "极高风险患者5年风险低于3%，其中8人位于G3a–A3单元格。", "weight of one GFR step relative to one albuminuria step; eGFR explained 70% of variation.": "一个GFR分级相对于一个白蛋白尿分级的权重；eGFR解释了70%的差异。", "patients above 40% with North American instead of non-North American constants.": "使用北美而非非北美常数时超过40%的患者。", "patients could change category on a single repeat test.": "一次重复检测就可能改变类别的患者。", "where a 70-year-old woman with ACR 300 mg/g reaches a 2-year risk of 40%.": "ACR 300 mg/g的70岁女性2年风险达到40%时的eGFR。", "Cite this tool": "引用本工具", "Methods and equations": "方法与公式", "References": "参考文献", "eGFR.": "eGFR。", "2021 CKD-EPI creatinine equation without a race term. Creatinine in mg/dL is converted with 88.4; ACR in mg/mmol with 8.84; urine creatinine in mmol/L with 11.31.": "不含种族项的2021年CKD-EPI肌酐方程。mg/dL肌酐按88.4换算；mg/mmol的ACR按8.84；mmol/L尿肌酐按11.31。", "KFRE (4-variable).": "KFRE（4变量）。", "Risk = 1 − S^exp(LP); S = 0.9832 (2-year) and 0.9365 (5-year) outside North America; 0.9750 and 0.9240 in North America.": "风险 = 1 − S^exp(LP)；S = 0.9832（2年）和0.9365（5年）（北美以外），北美为0.9750和0.9240。", "Thresholds.": "阈值。", "KDIGO 2024: 5-year 3–5% for referral, 2-year >10% for multidisciplinary care, 2-year >40% for KRT preparation; eGFR criteria <30, <30 and <20. NICE NG203: 5-year >5%.": "KDIGO 2024：转诊为5年3–5%，多学科管理为2年>10%，肾脏替代治疗准备为2年>40%；eGFR标准为<30、<30和<20。NICE NG203：5年>5%。", "Contours, what-if curves and waterfall.": "等高线、假设曲线和瀑布图。", "Solved directly from the equation, holding the other variables constant.": "在其他变量不变的情况下直接由方程求解。", "Repeat testing.": "重复检测。", "3,000 draws from mean-preserving log-normal distributions with published day-to-day variability (creatinine 5.5%, ACR 11.3%; McCudden 2018) or a conservative alternative (5% and 30%).": "基于已发表日间变异（肌酐5.5%，ACR 11.3%；McCudden 2018）或保守替代值（5%和30%）的保均值对数正态分布抽样3,000次。", "PCR conversion.": "PCR换算。", "Sumida 2020, adjusted for sex, diabetes and hypertension.": "Sumida 2020，按性别、糖尿病和高血压校正。", "Clinic data.": "门诊数据。", "eGFR, ACR, KDIGO grade and KFRE risk of 129 de-identified patients.": "129名去标识化患者的eGFR、ACR、KDIGO分级和KFRE风险。", "Limitations.": "局限性。", "No outcome data to check calibration in Vietnamese patients; death not modelled as a competing event; single measurements.": "缺乏结局数据以检验越南患者的校准；未将死亡作为竞争事件建模；单次测量。", "How to read it.": "解读方法。", "Illustrations: kidney by Servier Medical Art (CC BY 3.0) and nephron by Emily A. Daniel (CC0), via Bioicons; dialyser, urine test, blood tube, tablets, heart and book by Science Figures (sciencefigures.org). KFRE Risk Map v2.3, November 2026.": "插图：肾脏来自Servier Medical Art（CC BY 3.0），肾单位来自Emily A. Daniel（CC0），经Bioicons；透析器、尿检、采血管、药片、心脏和书本来自Science Figures（sciencefigures.org）。KFRE Risk Map v2.3，2026年11月。"}, "fr": {"KFRE Risk Map": "KFRE Risk Map", "KDIGO 2024 companion": "Compagnon de KDIGO 2024", "Overview": "Vue d’ensemble", "Risk map": "Carte de risque", "Explain": "Explication", "Repeat tests": "Tests répétés", "Study": "Étude", "Sections ères de DFGe qu’ils complètent", "Nephrology referral and follow-up": "Orientation et suivi en néphrologie", "Multidisciplinary CKD care": "Prise en charge pluridisciplinaire de la MRC", "Prepare for kidney replacement therapy": "Préparer le traitement de suppléance rénale", "Indicated": "Indiqué", "Indicated by KFRE": "Indiqué par le KFRE", "Indicated by eGFR": "Indiqué par le DFGe", "Not yet indicated": "Pas encore indiqué", "Met": "Atteint", "Not met": "Non atteint", "near threshold": "près du seuil", "KFRE 5-year ≥3%": "KFRE à 5 ans ≥3 %", "KFRE 2-year >10%": "KFRE à 2 ans >10 %", "KFRE 2-year >40%": "KFRE à 2 ans >40 %", "KDIGO and KFRE disagree.": "KDIGO et KFRE divergent.", "Very high risk on the heat map, but a 5-year KFRE below 3%. The heat map also reflects mortality and cardiovascular risk; follow-up for albuminuria remains warranted.": "Risque très élevé sur la carte thermique, mais KFRE à 5 ans inférieur à 3 %. La carte reflète aussi la mortalité et le risque cardiovasculaire ; le suivi de l’albuminurie reste justifié.", "Late trigger in an older woman.": "Déclenchement tardif chez une femme âgée.", "At the current ACR, the 2-year risk never reaches 40%.": "Au RAC actuel, le risque à 2 ans n’atteint jamais 40 %.", "Use an eGFR criterion below 20 alongside the 40% threshold.": "Utilisez un critère de DFGe inférieur à 20 en plus du seuil de 40 %.", "Clinic comparison": "Comparaison avec la consultation", "Same age, eGFR and ACR": "Même âge, DFGe et RAC", "Female versus male": "Femme versus homme", "Female (this patient)": "Femme (ce patient)", "Male sex multiplies the hazard by 1.28, equivalent to an eGFR about 2.2 mL/min/1.73 m² lower.": "Le sexe masculin multiplie le risque instantané par 1,28, soit l’équivalent d’un DFGe inférieur d’environ 2,2 mL/min/1,73 m².", "North American": "Nord-américaine", "Non-North American": "Non nord-américaine", "North American calibration": "Calibration nord-américaine", "No KFRE estimate": "Pas d’estimation KFRE", "Five-year risk of clinic patients by KDIGO category with this patient marked": "Risque à 5 ans des patients de la consultation par catégorie KDIGO, avec ce patient marqué", "● patient": "● patient", "patient": "patient", "ref": "réf.", "Reference": "Référence", "Where the patient sits on the eGFR–ACR plane": "Position du patient sur le plan DFGe–RAC", "eGFR–ACR risk map": "Carte de risque DFGe–RAC", "Risk map of eGFR against ACR with KDIGO cells and KFRE contours": "Carte de risque du DFGe selon le RAC avec cellules KDIGO et courbes KFRE", "Risk rises towards the lower right. A patient above a contour is below that threshold. The dashed drop line shows how far eGFR must fall, at the current ACR, before the 2-year risk reaches 40%. Contours slope because the KFRE weighs one GFR step (×5.3) about 1.6 times more than one albuminuria step (×2.8), whereas the heat map treats the two axes equally.": "Le risque augmente vers le coin inférieur droit. Un patient au-dessus d’une courbe est sous ce seuil. La ligne pointillée verticale montre de combien le DFGe doit baisser, au RAC actuel, pour que le risque à 2 ans atteigne 40 %. Les courbes sont inclinées car le KFRE pèse un palier de DFG (×5,3) environ 1,6 fois plus qu’un palier d’albuminurie (×2,8), alors que la carte thermique traite les deux axes de façon égale.", "Solid 5-yr 3% · dashed 2-yr 10% · dotted 2-yr 40%": "Plein 5 ans 3 % · tirets 2 ans 10 % · pointillés 2 ans 40 %", "5-yr": "5 ans", "2-yr": "2 ans", "Urine ACR (mg/g, log scale)": "RAC urinaire (mg/g, échelle log)", "eGFR (mL/min/1.73 m²)": "DFGe (mL/min/1,73 m²)", "ACR (mg/g, log scale)": "RAC (mg/g, échelle log)", "eGFR (CKD-EPI 2021)": "DFGe (CKD-EPI 2021)", "Urine ACR": "RAC urinaire", "eGFR ≥60 ↑": "DFGe ≥60 ↑", "Clinic patients": "Patients de la consultation", "5-year risk bands by KDIGO category": "Classes de risque à 5 ans par catégorie KDIGO", "Number of clinic patients in each band": "Nombre de patients de la consultation par classe", "Share of clinic patients in each 5-year risk band by KDIGO category": "Part des patients de la consultation par classe de risque à 5 ans et catégorie KDIGO", "5-year <3%": "5 ans <3 %", "5-year 3–5%": "5 ans 3–5 %", "5-year >5%": "5 ans >5 %", "5-year ≥3%": "5 ans ≥3 %", "2-year >10%": "2 ans >10 %", "2-year >40%": "2 ans >40 %", "Calibration changes the 40% decision": "La calibration change la décision à 40 %", "Clinic patients above each threshold under two calibrations": "Patients de la consultation au-dessus de chaque seuil selon deux calibrations", "Number of clinic patients above each threshold under two calibrations": "Nombre de patients de la consultation au-dessus de chaque seuil selon deux calibrations", "Clinic data not included": "Données de la consultation non incluses", "This build does not include the de-identified clinic dataset (assets/js/cohort.js), so charts based on the study cohort are hidden. The calculator itself is unaffected.": "Cette version n’inclut pas le jeu de données anonymisé de la consultation (assets/js/cohort.js) ; les graphiques fondés sur la cohorte sont masqués. Le calculateur n’est pas affecté.", "What drives the estimate and how it changes": "Ce qui détermine l’estimation et comment elle évolue", "Four inputs, one equation": "Quatre données, une équation", "The KFRE combines age, sex, eGFR and urine ACR into a single linear predictor. eGFR dominates: one KDIGO GFR step multiplies the hazard by 5.3, one albuminuria step by 2.8, male sex by 1.28, and each extra decade of age lowers it by 20%.": "Le KFRE combine l’âge, le sexe, le DFGe et le RAC urinaire en un prédicteur linéaire unique. Le DFGe domine : un palier de DFG KDIGO multiplie le risque instantané par 5,3, un palier d’albuminurie par 2,8, le sexe masculin par 1,28, et chaque décennie d’âge supplémentaire le réduit de 20 %.", "GFR step ×5.31": "Palier de DFG ×5,31", "Albuminuria step ×2.82": "Palier d’albuminurie ×2,82", "Male ×1.28": "Homme ×1,28", "+10 years ×0.80": "+10 ans ×0,80", "From the reference patient to this patient": "Du patient de référence à ce patient", "2-year risk as each variable is applied in turn": "Risque à 2 ans en appliquant chaque variable tour à tour", "Waterfall of the KFRE linear predictor from the reference patient to this patient": "Graphique en cascade du prédicteur linéaire du KFRE, du patient de référence à ce patient", "The KFRE reference patient is 70 years old, 56% male, with eGFR 36.1 and ACR 170 mg/g (2-year risk 1.68%). Each bar multiplies the hazard by the factor shown; red raises risk, teal lowers it. In the study cohort, eGFR explained 70% of between-patient variation, ACR 27%, age 3% and sex 1%.": "Le patient de référence du KFRE a 70 ans, 56 % d’hommes, un DFGe de 36,1 et un RAC de 170 mg/g (risque à 2 ans 1,68 %). Chaque barre multiplie le risque instantané par le facteur indiqué ; le rouge l’augmente, le bleu-vert le réduit. Dans la cohorte, le DFGe expliquait 70 % de la variation entre patients, le RAC 27 %, l’âge 3 % et le sexe 1 %.", "If eGFR falls": "Si le DFGe baisse", "Age, sex and ACR held constant": "Âge, sexe et RAC constants", "Grey lines mark the eGFR criteria. Where the curve crosses a red threshold to the right of its grey line, the KFRE criterion would be met later than the eGFR criterion. The dashed curve uses North American calibration.": "Les lignes grises marquent les critères de DFGe. Si la courbe croise un seuil rouge à droite de sa ligne grise, le critère KFRE serait atteint plus tard que le critère de DFGe. La courbe pointillée utilise la calibration nord-américaine.", "If albuminuria changes": "Si l’albuminurie change", "Age, sex and eGFR held constant": "Âge, sexe et DFGe constants", "Grey lines mark the KDIGO albuminuria boundaries (30 and 300 mg/g). A tenfold change in ACR changes the hazard 2.8-fold.": "Les lignes grises marquent les limites d’albuminurie KDIGO (30 et 300 mg/g). Un RAC multiplié par dix change le risque instantané d’un facteur 2,8.", "If the patient were older or younger": "Si le patient était plus âgé ou plus jeune", "Sex, eGFR and ACR held constant": "Sexe, DFGe et RAC constants", "Older age lowers predicted risk because, on average, older patients progress more slowly and more often die before kidney failure. This is why the 40% threshold is reached late in older adults.": "L’âge plus élevé abaisse le risque prédit car, en moyenne, les patients âgés progressent plus lentement et décèdent plus souvent avant l’insuffisance rénale. C’est pourquoi le seuil de 40 % est atteint tard chez les personnes âgées.", "40% never reached": "40 % jamais atteint", "woman": "une femme", "man": "un homme", "How stable the classification is": "Stabilité du classement", "One sample is a snapshot": "Un échantillon n’est qu’un instantané", "Urine ACR varies from day to day, and creatinine varies less but still moves. Near a threshold, a single result can fall on either side. This screen simulates repeat samples to show how often the decision would change.": "Le RAC urinaire varie d’un jour à l’autre ; la créatinine varie moins mais bouge aussi. Près d’un seuil, un résultat isolé peut tomber de part ou d’autre. Cet écran simule des prélèvements répétés pour montrer combien de fois la décision changerait.", "Published variability (ACR 11.3%)": "Variabilité publiée (RAC 11,3 %)", "Conservative (ACR 30%)": "Prudente (RAC 30 %)", "Creatinine CV 5.5%": "CV de la créatinine 5,5 %", "ACR day-to-day CV 11.3%": "CV jour à jour du RAC 11,3 %", "3,000 simulated repeats": "3 000 répétitions simulées", "Chance of being above each threshold on a repeat test": "Probabilité d’être au-dessus de chaque seuil lors d’un test répété", "3,000 simulated repeat measurements of creatinine and ACR": "3 000 mesures répétées simulées de créatinine et de RAC", "A probability between 20% and 80% means a single repeat test could change the decision. Repeat ACR and creatinine before acting on a borderline result.": "Une probabilité entre 20 % et 80 % signifie qu’un seul test répété pourrait changer la décision. Répétez RAC et créatinine avant d’agir sur un résultat limite.", "stays above": "reste au-dessus", "stays below": "reste en dessous", "2-year risk on repeat testing": "Risque à 2 ans lors de tests répétés", "5-year risk on repeat testing": "Risque à 5 ans lors de tests répétés", "Distribution": "Distribution", "How to read this chart": "Comment lire ce graphique", "Dialyser": "Dialyseur", "Urine sample with a reagent test strip": "Échantillon d’urine avec bandelette réactive", "The study": "L’étude", "Findings from 129 patients at Lanh Binh Thang General Hospital": "Résultats chez 129 patients du Lanh Binh Thang General Hospital", "KFRE versus the KDIGO 2024 heat map": "KFRE versus la carte thermique KDIGO 2024", "Cross-sectional study of 129 outpatients with CKD G3–G5 at Lanh Binh Thang General Hospital, Ho Chi Minh City (May–September 2026). The study compared KFRE-based and heat-map risk stratification and decomposed the KFRE mathematically to explain where, and why, the two disagree.": "Étude transversale de 129 patients ambulatoires atteints de MRC G3–G5 au Lanh Binh Thang General Hospital, Hô Chi Minh-Ville (mai–septembre 2026). L’étude a comparé la stratification du risque par le KFRE et par la carte thermique, et a décomposé mathématiquement le KFRE pour expliquer où et pourquoi les deux divergent.", "patients with a 5-year risk of 3% or more were already very high risk by KDIGO.": "patients avec un risque à 5 ans ≥ 3 % étaient déjà à risque très élevé selon KDIGO.", "very-high-risk patients had a 5-year risk below 3%, eight of them in cell G3a–A3.": "patients à risque très élevé avaient un risque à 5 ans < 3 %, dont huit dans la cellule G3a–A3.", "weight of one GFR step relative to one albuminuria step; eGFR explained 70% of variation.": "poids d’un palier de DFG par rapport à un palier d’albuminurie ; le DFGe expliquait 70 % de la variation.", "patients above 40% with North American instead of non-North American constants.": "patients au-dessus de 40 % avec les constantes nord-américaines au lieu des non nord-américaines.", "patients could change category on a single repeat test.": "patients pourraient changer de catégorie sur un seul test répété.", "where a 70-year-old woman with ACR 300 mg/g reaches a 2-year risk of 40%.": "DFGe auquel une femme de 70 ans avec un RAC de 300 mg/g atteint un risque à 2 ans de 40 %.", "Cite this tool": "Citer cet outil", "Methods and equations": "Méthodes et équations", "References": "Références", "eGFR.": "DFGe.", "2021 CKD-EPI creatinine equation without a race term. Creatinine in mg/dL is converted with 88.4; ACR in mg/mmol with 8.84; urine creatinine in mmol/L with 11.31.": "Équation CKD-EPI 2021 à la créatinine, sans terme ethnique. Créatinine en mg/dL convertie avec 88,4 ; RAC en mg/mmol avec 8,84 ; créatinine urinaire en mmol/L avec 11,31.", "KFRE (4-variable).": "KFRE (4 variables).", "Risk = 1 − S^exp(LP); S = 0.9832 (2-year) and 0.9365 (5-year) outside North America; 0.9750 and 0.9240 in North America.": "Risque = 1 − S^exp(LP) ; S = 0,9832 (2 ans) et 0,9365 (5 ans) hors Amérique du Nord ; 0,9750 et 0,9240 en Amérique du Nord.", "Thresholds.": "Seuils.", "KDIGO 2024: 5-year 3–5% for referral, 2-year >10% for multidisciplinary care, 2-year >40% for KRT preparation; eGFR criteria <30, <30 and <20. NICE NG203: 5-year >5%.": "KDIGO 2024 : 5 ans 3–5 % pour l’orientation, 2 ans >10 % pour la prise en charge pluridisciplinaire, 2 ans >40 % pour la préparation à la suppléance ; critères de DFGe <30, <30 et <20. NICE NG203 : 5 ans >5 %.", "Contours, what-if curves and waterfall.": "Courbes de niveau, courbes de simulation et cascade.", "Solved directly from the equation, holding the other variables constant.": "Résolues directement à partir de l’équation, les autres variables étant constantes.", "Repeat testing.": "Tests répétés.", "3,000 draws from mean-preserving log-normal distributions with published day-to-day variability (creatinine 5.5%, A
